name: Release APK

# Builds the prod flavor on every merge to main and publishes the APKs to
# GitHub Releases (tag = pubspec version).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check release secrets
        id: secrets
        env:
          ENV_PROD_JSON: ${{ secrets.ENV_PROD_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$ENV_PROD_JSON" ] && [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_PROPERTIES" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release skipped: set ENV_PROD_JSON, ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_PROPERTIES secrets (see README → CI/CD)."
          fi

      - name: Restore secrets
        if: steps.secrets.outputs.ready == 'true'
        env:
          ENV_PROD_JSON: ${{ secrets.ENV_PROD_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          mkdir -p env
          echo "$ENV_PROD_JSON" > env/prod.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "$ANDROID_KEY_PROPERTIES" > android/key.properties

      - name: Generate code
        if: steps.secrets.outputs.ready == 'true'
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build

      - name: Build release APKs (prod, obfuscated)
        if: steps.secrets.outputs.ready == 'true'
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: >
          flutter build apk --release --split-per-abi
          --flavor prod -t lib/main_prod.dart
          --dart-define-from-file=env/prod.json
          --obfuscate --split-debug-info=build/debug-info

      - name: Read version
        if: steps.secrets.outputs.ready == 'true'
        id: version
        run: echo "name=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.secrets.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Yetkaz v${{ steps.version.outputs.name }}
          body_path: CHANGELOG.md
          files: build/app/outputs/flutter-apk/*-prod-release.apk

      - name: Keep debug symbols (for Crashlytics)
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-info
          path: build/debug-info
